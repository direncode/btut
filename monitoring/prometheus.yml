global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'btut-production'
    replica: '1'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # BTUT API
  - job_name: 'btut-api'
    static_configs:
      - targets: ['btut-api.fly.dev:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
