[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btut-sdk"
version = "1.0.0"
description = "Python SDK for BTUT multi-agent simulations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Diren Akkocdemir", email = "diren@btut.ai"}
]
keywords = ["multi-agent", "simulation", "game-theory", "coordination", "mean-field"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5.0", "seaborn>=0.12.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "mypy>=1.0.0"]
all = ["matplotlib>=3.5.0", "seaborn>=0.12.0", "pytest>=7.0.0"]

[project.urls]
Homepage = "https://btut.ai"
Documentation = "https://btut.ai/docs"
Repository = "https://github.com/direncode/btut"
"Bug Tracker" = "https://github.com/direncode/btut/issues"
