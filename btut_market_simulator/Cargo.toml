[package]
name = "btut_market_simulator"
version = "1.0.0"
edition = "2021"
authors = ["BTUT Research Team"]
description = "Planetary-scale multi-agent financial market simulator using Bivariate Trajectory-Undercurrent Theory"
license = "Apache-2.0"
repository = "https://github.com/btut/btut_market_simulator"
keywords = ["simulation", "market", "multi-agent", "btut", "finance"]
categories = ["simulation", "science"]
rust-version = "1.70"

[features]
default = ["parallel"]
parallel = ["rayon"]
# Future: distributed mode for cluster deployment
# distributed = ["tokio", "tonic"]

[dependencies]
# Parallelism - zero-cost parallel iterators
rayon = { version = "1.10", optional = true }

# Serialization - config and output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Numerical computing - efficient array operations
ndarray = { version = "0.16", features = ["rayon", "serde"] }

# Random number generation - high-quality RNG with distributions
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"

# Logging and diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI and configuration
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Ordered floats for order book price levels
ordered-float = { version = "4.2", features = ["serde"] }

# Fast hashing for agent IDs
rustc-hash = "2.0"

# Memory-efficient collections
smallvec = { version = "1.13", features = ["serde"] }

# Progress bars for long simulations
indicatif = "0.17"

# Statistical functions
statrs = "0.17"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
approx = "0.5"

[[bench]]
name = "btut_benchmarks"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
